<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brisa — Custom CSS Showcase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>Brisa Custom CSS</span>
        <span class="tag">DisableThemeCSS: true</span>
      </div>
      <a class="inspector-link" href="/brisa/inspector" target="_blank">IPC Inspector ↗</a>
    </header>

    <main class="container">
      <section class="hero-card">
        <div class="hero-header">
          <div>
            <h1>Bring Your Own Design System</h1>
            <p class="subtitle">
              No built-in theme stylesheet is injected. Full IPC, validation, SSE events, and OS light/dark detection (`data-os-theme`) remain active.
            </p>
          </div>
        </div>

        <form class="greet-form" onsubmit="handleGreet(event)">
          <div class="field">
            <label for="name-input">Developer Name</label>
            <div class="input-row">
              <input
                id="name-input"
                type="text"
                placeholder="Type your name (min 2 chars)…"
                value="Ada Lovelace"
                autocomplete="off"
              />
              <button type="submit" class="btn-primary">Invoke Go IPC</button>
            </div>
          </div>
        </form>

        <div id="feedback" class="feedback" hidden></div>
      </section>

      <section class="metrics-grid">
        <article class="metric-card">
          <span class="metric-label">Platform</span>
          <strong class="metric-value" id="stat-platform">—</strong>
        </article>
        <article class="metric-card">
          <span class="metric-label">Go Runtime</span>
          <strong class="metric-value" id="stat-go">—</strong>
        </article>
        <article class="metric-card">
          <span class="metric-label">Goroutines</span>
          <strong class="metric-value" id="stat-goroutines">—</strong>
        </article>
        <article class="metric-card">
          <span class="metric-label">Heap / Uptime</span>
          <strong class="metric-value" id="stat-heap">—</strong>
        </article>
      </section>
    </main>
  </div>

  <script>
    function renderStats(s) {
      document.getElementById("stat-platform").textContent = s.os + "/" + s.arch;
      document.getElementById("stat-go").textContent = s.goVersion;
      document.getElementById("stat-goroutines").textContent = s.goroutines;
      document.getElementById("stat-heap").textContent = s.heapMB + " · " + s.uptime;
    }

    async function handleGreet(event) {
      event.preventDefault();
      const box = document.getElementById("feedback");
      const name = document.getElementById("name-input").value;

      try {
        const res = await brisa.call.greet({ name });
        box.hidden = false;
        box.className = "feedback success";
        box.textContent = "[" + res.timestamp + "] " + res.message;
      } catch (err) {
        box.hidden = false;
        box.className = "feedback error";
        const details = err.errors ? Object.values(err.errors).flat().join(", ") : err.message;
        box.textContent = details;
      }
    }

    window.addEventListener("DOMContentLoaded", async () => {
      const initial = await brisa.call.stats();
      renderStats(initial);
      brisa.on("runtime:tick", renderStats);
    });
  </script>
</body>
</html>
